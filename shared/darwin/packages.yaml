      binary: launchd-mgmt
    nextdns-mgmt:
      source: git+file://${toolsPath}#subdirectory=packages/nextdns-mgmt
      binary: nextdns-mgmt
    ps-top:
      source: git+file://${toolsPath}#subdirectory=packages/ps-top
