# Packages mini and the mooing laptops share. Host files add their own
# entries: maps merge by key, brew lists append.

npm:
  packages:
    "@earendil-works/pi-coding-agent": {}
    "@bitwarden/cli": {}
    "@steipete/summarize": {}
    "@xai-official/grok": {}
    "@tobilu/qmd": {}
    taskforge-md:
      binary: taskforge

uv:
