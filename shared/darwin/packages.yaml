      binary: youtube

go:
  packages:
    go-grip:
      source: github.com/chrishrb/go-grip
      binary: go-grip
    gwq:
      source: github.com/d-kuro/gwq/cmd/gwq
      binary: gwq
    # stc alias in the shared fish config.
    stc:
      source: github.com/tenox7/stc
      binary: stc
    username:
      source: github.com/ivankovnatsky/username
      binary: username

cargo:
  packages:
    genpass:
      version: 0.5.1

curlShell:
  "https://antigravity.google/cli/install.sh":
    shell: bash
    uninstall: >-
      for p in ~/.local/bin/agy ~/.cache/antigravity; do
      if [ -e "$p" ] || [ -L "$p" ]; then trash "$p"; fi; done

