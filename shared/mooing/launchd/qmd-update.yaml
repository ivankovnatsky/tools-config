launchd:
  agents:
    # No `qmd cleanup`: on 2.8.3 it permanently drops docs that a run with
    # the vault path missing marked inactive (tobi/qmd#989).
    qmd-update:
      keepAlive: false
      startCalendarInterval: { minute: 30 }
      environment:
        PATH: ${npmBin}:/opt/homebrew/bin:/usr/bin:/bin
      # Re-adds a collection whose path changed; qmd has no path update and
      # stores the realpath, so compare against that or a symlinked path
      # re-adds every run.
      preStart: |
        /bin/mkdir -p "${home}/.local/share/agent-sessions/md"
        ${uvBin}/agent-sessions ${renderedDir}/agent-sessions.json || echo "agent-sessions failed"
        current=$(qmd collection show notes 2>&1 | sed -n 's/^ *Path: *//p')
        want=$(realpath -q "${home}/Library/Mobile Documents/iCloud~md~obsidian/Documents/Notes" || echo "${home}/Library/Mobile Documents/iCloud~md~obsidian/Documents/Notes")
        if [ "$current" != "$want" ]; then
          if [ -n "$current" ]; then qmd collection remove notes; fi
          qmd collection add "${home}/Library/Mobile Documents/iCloud~md~obsidian/Documents/Notes" --name notes
        fi
        current=$(qmd collection show sessions 2>&1 | sed -n 's/^ *Path: *//p')
        want=$(realpath -q "${home}/.local/share/agent-sessions/md" || echo "${home}/.local/share/agent-sessions/md")
        if [ "$current" != "$want" ]; then
          if [ -n "$current" ]; then qmd collection remove sessions; fi
          qmd collection add "${home}/.local/share/agent-sessions/md" --name sessions
          qmd context add qmd://sessions 'Past agent sessions (Claude Code, Codex, Grok, pi): user and assistant text only'
        fi
      command: /bin/bash -c 'qmd update && qmd embed'
