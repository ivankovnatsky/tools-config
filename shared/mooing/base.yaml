# Shared by Mooings-MacBook-Air and Mooings-MacBook-Pro
# (nix-config: machines/.mooing). Host files set hostName.
vars:
  localBin: ${home}/.local/bin
  uvBin: ${localBin}
  npmBin: ${home}/.npm/bin
  goBin: ${home}/.go/bin

paths:
  uvBin: ${uvBin}
  uvToolDir: ${home}/.local/share/uv/tools
  npmBin: ${npmBin}
  goPath: ${home}/.go
  goBin: ${goBin}
  cargoHome: ${home}/.cargo
  # cargo bins go next to uv tools, so .cargo/bin stays off PATH.
  cargoRoot: ${home}/.local
