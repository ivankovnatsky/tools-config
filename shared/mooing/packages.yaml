# Packages for Mooings-MacBook-Air and Mooings-MacBook-Pro, ported from
# nix-config (machines/.mooing/darwin/homebrew.nix, .mooing/home/*.nix,
# home/packages*.nix, home/tools.nix). Entries from shared/base.yaml and
# shared/darwin/packages.yaml merge in as dict keys; brew lists append.
#
# helm-secrets, kubectl-images and kubectl-view-secret come from release
# archives in files.yaml `fetch:`.
#
# No pi packages on the laptops.

npm:
  packages:
    defuddle: {}

uv:
  packages:
    awscurl: {}
    piper-tts:
      binary: piper
    supertonic:
      binary: supertonic
    yt-dlp: {}
    # nix-config had it in a python3 env with the cli extra.
    jira:
      source: jira[cli]
      binary: jirashell
    aws-console:
      source: git+file://${toolsPath}#subdirectory=packages/aws-console
      binary: aws-console
    confluence:
      source: git+file://${toolsPath}#subdirectory=packages/confluence
      binary: confluence
    git-worktree-init:
      source: git+file://${toolsPath}#subdirectory=packages/git-worktree-init
      binary: git-worktree-init
    jira-custom:
      source: git+file://${toolsPath}#subdirectory=packages/jira-custom
      binary: jira-custom
    k8s-context:
      source: git+file://${toolsPath}#subdirectory=packages/k8s-context
      binary: k8s-context
    pblock:
      source: git+file://${toolsPath}#subdirectory=packages/pblock
      binary: pblock
    screenshot-ocr:
      source: git+file://${toolsPath}#subdirectory=packages/screenshot-ocr
      binary: screenshot-ocr

go:
  packages:
    aws-sso-creds:
      source: github.com/jaxxstorm/aws-sso-creds/cmd/aws-sso-creds
      binary: aws-sso-creds
      # v2.1.1; v2 tags lack the /v2 module path, so @latest resolves to v1.5.0
      commit: 5b6d99977bff8264801ee9748e2169bfb954d73a
    eks-node-viewer:
      source: github.com/awslabs/eks-node-viewer/cmd/eks-node-viewer
      binary: eks-node-viewer
    kail:
      source: github.com/boz/kail/cmd/kail
      binary: kail
    kubepug:
      source: github.com/kubepug/kubepug
      binary: kubepug

brew:
  taps:
    - openclaw/homebrew-tap
    - raine/homebrew-workmux
  trust:
    taps:
      - openclaw/tap
      - raine/workmux
  brews:
    - argocd
    - aws-cdk
    - aws-sso-cli
    - awscli
    - bun
    - curlie
    - displayplacer
    - dockutil
    - doggo
    - gcx
    - hadolint
    - helm
    - hyperfine
    - jira-cli
    - k9s
    - krew
    - kubecolor
    - kubectx
    - kubernetes-cli
    - kustomize
    - ldns
    - mise
    - openclaw/tap/peekaboo
    - raine/workmux/workmux
    - python-yq
    - syncthing
    - vals
    - wireguard-tools
  casks:
    - coconutbattery
    - microsoft-teams
    - session-manager-plugin
  masApps:
    Microsoft Excel: 462058435
    Microsoft Word: 462054704
    WireGuard: 1451685025
