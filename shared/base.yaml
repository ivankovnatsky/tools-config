stateFile: ~/.local/state/tools/state.json

vars:
  home: ${env:HOME}
  homeWorkPath: ${home}

npm:
  packages:
    "@google/gemini-cli":
      binary: gemini
    "@openai/codex":
      binary: codex

uv:
  packages:
    tools:
      source: git+https://github.com/ivankovnatsky/tools.git
      binary: tools

go:
  packages:
    rclone:
      source: github.com/rclone/rclone
      binary: rclone

files:
  - dir: dotfiles

templates:
  claude-settings:
    path: ~/.claude/settings.json
    file: templates/claude-settings.json
    mode: "0644"

curlShell:
  "https://claude.ai/install.sh": bash
