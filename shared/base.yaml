stateFile: ~/.local/state/tools/state.json

vars:
  home: ${env:HOME}
  homeWorkPath: ${home}
  toolsPath: ${home}/Sources/github.com/ivankovnatsky/tools

npm:
  packages:
    "@openai/codex":
      binary: codex

uv:
  packages:
    tools:
      source: git+file://${toolsPath}
      binary: tools

templates:
  claude-settings:
    path: ~/.claude/settings.json
    file: templates/claude-settings.json
    mode: "0644"

curlShell:
  "https://claude.ai/install.sh": bash
