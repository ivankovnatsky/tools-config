stateFile: ~/.local/state/tools/state.json

vars:
  home: ${env:HOME}
  homeWorkPath: ${home}
  toolsPath: ${home}/Sources/github.com/ivankovnatsky/tools

npm:
  packages:
    "@openai/codex":
      binary: codex

uv:
  packages:
    tools:
      source: git+file://${toolsPath}
      binary: tools
    claude-statusline:
      source: git+file://${toolsPath}#subdirectory=packages/claude-statusline
      binary: claude-statusline

templates:
  claude-settings:
    path: ~/.claude/settings.json
    file: templates/claude-settings.json
    mode: "0644"
    backup: false
  gwq:
    path: ~/.config/gwq/config.toml
    file: shared/home/.config/gwq/config.toml
    mode: "0644"
  # nix-config: tools packages/turnoff (exec settings turnoff).
  turnoff:
    path: ~/.local/bin/turnoff
    file: shared/home/.local/bin/turnoff
    mode: "0755"

curlShell:
  "https://claude.ai/install.sh": bash
