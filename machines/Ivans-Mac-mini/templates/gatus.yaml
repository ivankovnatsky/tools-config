templates:
  gatus-config:
    path: ${renderedDir}/gatus-config.yaml
    restartUnits:
      - launchd:com.ivankovnatsky.gatus
    format: yaml
    content:
      web: { address: "${bindAddress}", port: 8086 }
      storage:
        type: sqlite
        path: ${externalStoragePath}/.gatus/data.db
        caching: true
      ui:
        title: mini | Gatus
        header: mini
        dashboard-heading: mini
        dashboard-subheading: Homelab services, grouped by host
        default-sort-by: group
      alerting:
        discord:
          webhook-url: ${sops:discord-webhook-gatus}
          default-alert:
            enabled: true
            failure-threshold: 3
            success-threshold: 2
            send-on-resolved: true
      # mini probes use loopback: miniIp vanishes when the LAN link drops.
      # a3 is powered off deliberately at times, so its probes have no alerts.
      endpoints:
        - name: external-domain
          group: local-domain
          url: https://forgejo.${sops:external-domain}
          interval: 60s
          conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 72h"]
          alerts: [{ type: discord }]
        - name: battery-dashboard
          group: local-domain
          url: https://battery.${sops:external-domain}/
          interval: 60s
          conditions:
            - "[STATUS] == 200"
            - "[BODY] == pat(*<title>Battery Monitoring</title>*)"
          alerts: [{ type: discord }]
        - name: caddy-http
          group: mini
          url: "tcp://127.0.0.1:80"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts: [{ type: discord }]
        - name: caddy-https
          group: mini
          url: "tcp://127.0.0.1:443"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts: [{ type: discord }]
        - name: dnsmasq
          group: mini
          url: 127.0.0.1
          dns: { query-name: example.com, query-type: A }
          interval: 60s
          conditions: ["[DNS_RCODE] == NOERROR"]
          alerts: [{ type: discord }]
        - name: stubby
          group: mini
          url: "tcp://127.0.0.1:5453"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts: [{ type: discord }]
        - name: ssh
          group: mini
          url: "tcp://127.0.0.1:22"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts: [{ type: discord }]
        - name: forgejo
          group: mini
          url: "http://127.0.0.1:3300"
          interval: 60s
          conditions: ["[STATUS] == 200"]
          alerts: [{ type: discord }]
        - name: forgejo-ssh
          group: mini
          url: "tcp://127.0.0.1:2222"
          interval: 60s
          conditions: ["[CONNECTED] == true"]
          alerts: [{ type: discord }]
        - name: syncthing
          group: mini
          url: "http://127.0.0.1:8384"
          interval: 60s
          conditions: ["[STATUS] == 200"]
          alerts: [{ type: discord }]
        - name: stash
          group: mini
          url: "http://127.0.0.1:9999"
          interval: 60s
          conditions: ["[STATUS] == 200"]
          alerts: [{ type: discord }]
        - name: battery-monitoring
