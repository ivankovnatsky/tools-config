templates:
  rabbitmq-config:
    path: ${renderedDir}/rabbitmq.conf
    mode: "0444"
    content: |
      listeners.tcp.default = 127.0.0.1:5672
      management.tcp.ip = 127.0.0.1
      management.tcp.port = 15672

  rabbitmq-enabled-plugins:
    path: ${renderedDir}/rabbitmq-enabled-plugins
    mode: "0444"
    content: |
      [rabbitmq_management].
