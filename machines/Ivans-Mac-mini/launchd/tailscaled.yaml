launchd:
  daemons:
    # Manual after first start: `sudo tailscale up`,
    # `sudo tailscale set --advertise-routes=192.168.50.0/24`, then approve the
    # subnet route in the Tailscale admin console.
    tailscaled:
      label: com.tailscale.tailscaled
      keepAlive: false
      command: /opt/homebrew/bin/tailscaled
