launchd:
  agents:
    auto-poweroff:
      waitForMounts:
        - ${externalVolume}
      runAtLoad: false
      keepAlive: false
      startCalendarInterval: { hour: 22, minute: 20 }
      command: ${uvBin}/homelab auto-shutdown

    auto-poweroff-notify:
      waitForMounts:
        - ${externalVolume}
      runAtLoad: false
      keepAlive: false
      startCalendarInterval: { hour: 22, minute: 10 }
      command: ${uvBin}/homelab auto-notify
