launchd:
  agents:
    # Re-renders sops secrets and templates at login; keepAlive retries until
    # it succeeds (e.g. when the SSH key is not readable yet after boot).
    sops-secrets:
      waitForPath: ${externalStoragePath}
      keepAlive:
        successfulExit: false
      environment:
        PATH: /opt/homebrew/bin:/usr/bin:/bin
      command: |-
        ${uvBin}/tools deploy \
        --config ${toolsConfigPath} \
        --scope sops \
        --scope templates \
        --approve
