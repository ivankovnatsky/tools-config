launchd:
  daemons:
    # ${externalStoragePath}/.local/bin/beszel-agent: nothing installs it yet, as with beszel-hub.
    beszel-agent:
      waitForPath: ${externalStoragePath}
      waitForSecrets: true
      environment:
        LISTEN: ${bindAddress}:45876
        KEY_FILE: ${sopsPath:beszel-hub-public-key}
      command: ${externalStoragePath}/.local/bin/beszel-agent
