launchd:
  services:
    # Profile options on the command line: archives are keyed by roots, so
    # history from the old ~/.unison/notes.prf runs carries over.
    unison-notes:
      runAtLoad: false
      keepAlive: false
      startInterval: 60
      command: |-
        /opt/homebrew/bin/unison \
        -batch -perms 0 -dontchmod -xattrs=false \
        -ignore 'Path .rumdl_cache' \
        -ignore 'Name .DS_Store' \
        -ignore 'Path .git' \
        -ignore 'Path .claude' \
        -ignore 'Path .obsidian/workspace.json' \
        -ignore 'Path .obsidian/workspace-mobile.json' \
        "${home}/Library/Mobile Documents/iCloud~md~obsidian/Documents/Notes" \
        "${home}/Notes"

    brctl-download-notes:
      keepAlive: false
      startCalendarInterval: { minute: 0 }
      command: |-
        /usr/bin/find "${home}/Library/Mobile Documents/iCloud~md~obsidian/Documents/Notes" \
        -exec /usr/bin/brctl download {} \;

    xattr-pin-notes:
      keepAlive: false
      command: |-
        /usr/bin/xattr -w "com.apple.fileprovider.pinned#PX" 1 \
        "${home}/Library/Mobile Documents/iCloud~md~obsidian" \
        "${home}/Library/Mobile Documents/com~apple~CloudDocs/Data/Infra"
