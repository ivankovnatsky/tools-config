[worktree]
basedir = "${home}/Worktrees"
auto_mkdir = true

[finder]
preview = true

[naming]
template = "{{.Host}}/{{.Owner}}/{{.Repository}}/{{.Branch}}"

[naming.sanitize_chars]
"/" = "-"
":" = "-"

[cd]
launch_shell = true

[ui]
icons = true
tilde_home = true

[[repository_settings]]
repository = "${home}/Sources/github.com/ivankovnatsky/nix-config"
copy_files = []
setup_commands = []
