vars:
  externalVolume: /Volumes/Storage
  externalStoragePath: ${externalVolume}/Data
  hostName: Ivans-Mac-mini
  miniIp: 192.168.50.4
  miniWifiIp: 192.168.50.12
  a3WifiIp: 192.168.50.11
  bindAddress: 0.0.0.0
  localAddress: 127.0.0.1
  uvBin: ${externalStoragePath}/.local/bin
  npmBin: ${externalStoragePath}/.npm/bin
  goBin: ${externalStoragePath}/.go/bin
  forgejoDir: ${externalStoragePath}/.forgejo
  stashDataDir: ${externalStoragePath}/.stash
  stashDir: ${externalStoragePath}/Stash
  mediaDir: ${externalStoragePath}/Media
  rabbitmqDir: ${externalStoragePath}/.rabbitmq
  podserviceDir: ${externalStoragePath}/.podservice
  transmissionDir: ${externalStoragePath}/.transmission
  agentSessionsDir: ${externalStoragePath}/.local/share/agent-sessions

paths:
  uvBin: ${externalStoragePath}/.local/bin
  uvToolDir: ${externalStoragePath}/.local/share/uv/tools
  npmBin: ${externalStoragePath}/.npm/bin
  bunBin: ${externalStoragePath}/.bun/bin
  bun: ${externalStoragePath}/.bun/bin
  goPath: ${externalStoragePath}/.go
  goBin: ${externalStoragePath}/.go/bin
  cargoHome: ${externalStoragePath}/.cargo
  # cargo bins go next to uv tools, so .cargo/bin stays off PATH.
  cargoRoot: ${externalStoragePath}/.local

# Shell env files are the env-* templates; this section only exports into
# tools' own process (uv installs).
env:
  vars:
    UV_PYTHON_INSTALL_DIR: ${externalStoragePath}/.local/share/uv/python
  shells: []

uv:
  packages:
    yt-dlp:
      source: yt-dlp[default,curl-cffi]
    mlx-whisper: {}
    # ranger scope.sh xlsx preview.
    xlsx2csv: {}
    battery-monitoring:
      source: git+file://${toolsPath}#subdirectory=packages/battery-monitoring
      binary: battery-monitoring
      restartUnits:
        - launchd:com.ivankovnatsky.battery-monitoring-serve
        - launchd:com.ivankovnatsky.battery-monitoring-check
    notifications:
      source: git+file://${toolsPath}#subdirectory=packages/notifications
      binary: notifications
    subs:
      source: git+file://${toolsPath}#subdirectory=packages/subs
      binary: subs
    podservice:
      source: git+https://github.com/ivankovnatsky/podservice.git
      binary: podservice

go:
  packages:
    gatus:
      source: github.com/TwiN/gatus/v5
      binary: gatus
      restartUnits: [launchd:com.ivankovnatsky.gatus]
    xcaddy:
      source: github.com/caddyserver/xcaddy/cmd/xcaddy
      binary: xcaddy

pi:
  packages:
    npm:pi-antigravity: {}

curlShell:
  "https://claude.ai/install.sh":
    shell: bash
    uninstall: >-
      for p in ~/.local/bin/claude ~/.local/share/claude ~/.local/state/claude
      ~/.cache/claude ~/.claude/downloads; do
      if [ -e "$p" ] || [ -L "$p" ]; then trash "$p"; fi; done

fetch:
  /Volumes/Storage/Data/.local/bin/stash:
    url: https://github.com/stashapp/stash/releases/download/v0.29.1/stash-macos
    sha256: b8c54d619021b97ee8c6f230f31d430009f45518e9d868505b413351011a7f35
    mode: "0755"
    restartUnits:
      - launchd:com.ivankovnatsky.stash
  /Volumes/Storage/Data/.local/bin/rbw-fzf:
    url: https://raw.githubusercontent.com/doy/rbw/1.15.0/bin/rbw-fzf
    sha256: a0328919dbbdb3c3a2431643a5b64a53914befcf25efb0fc489b33eee46d2f7b
    mode: "0755"
  /Volumes/Storage/Data/.local/bin/git-credential-rbw:
    url: https://raw.githubusercontent.com/doy/rbw/1.15.0/bin/git-credential-rbw
    sha256: 0207c0da6385d16ec307848bc8e01fc09c497e37700340596e5177a8ca558920
    mode: "0755"
  /Volumes/Storage/Data/.local/bin/beszel-agent:
    url: https://github.com/henrygd/beszel/releases/download/v0.21.1/beszel-agent_darwin_arm64.tar.gz
    sha256: 9246065f680cdb0af2885b7bf5876dc45b754019f2c90eb28550cf45db978eb8
    install: |
      tar -xzf "$src" beszel-agent
      mv beszel-agent "$out"
    mode: "0755"
    restartUnits:
      - launchd:com.ivankovnatsky.beszel-agent
  /Volumes/Storage/Data/.local/bin/beszel-hub:
    url: https://github.com/henrygd/beszel/releases/download/v0.21.1/beszel_darwin_arm64.tar.gz
    sha256: 39778df5354656697ef49f01422910c89b7300126cd38ece007b504821ecded9
    install: |
      tar -xzf "$src" beszel
      mv beszel "$out"
    mode: "0755"
    restartUnits:
      - launchd:com.ivankovnatsky.beszel-hub
  # Upstream executables are unsigned; Apple Silicon refuses unsigned arm64 code.
  /Applications/Prowlarr.app:
    url: https://github.com/Prowlarr/Prowlarr/releases/download/v2.6.5.5623/Prowlarr.master.2.6.5.5623.osx-app-core-arm64.zip
    sha256: cd3401b34a11256fcb5e49c26e20382ca4d3f14c1d2c102247a4a46e66a5ab24
    install: |
      ditto -x -k "$src" .
      codesign --force --deep -s - Prowlarr.app
      mv Prowlarr.app "$out"
    restartUnits:
      - launchd:com.ivankovnatsky.prowlarr
  /Applications/Radarr.app:
    url: https://github.com/Radarr/Radarr/releases/download/v6.4.4.10685/Radarr.master.6.4.4.10685.osx-app-core-arm64.zip
    sha256: fda0e0750717cbde378775f60b25e328a8fb8677f6a070b7c84c5f212827ec8b
    install: |
      ditto -x -k "$src" .
      codesign --force --deep -s - Radarr.app
      mv Radarr.app "$out"
    restartUnits:
      - launchd:com.ivankovnatsky.radarr
  /Applications/Sonarr.app:
    url: https://github.com/Sonarr/Sonarr/releases/download/v4.0.20.3014/Sonarr.main.4.0.20.3014.osx-arm64-app.zip
    sha256: cee10454f117605faf8db2e8c6acb938c0cfa4907eb302cc159b7e8cafe564c0
    install: |
      ditto -x -k "$src" .
      codesign --force --deep -s - Sonarr.app
      mv Sonarr.app "$out"
    restartUnits:
      - launchd:com.ivankovnatsky.sonarr

files:
  # launchd jobs and GUI apps read this, not the shell-only UV_* vars.
  - target: ~/.config/uv/uv.toml
    source: machines/Ivans-Mac-mini/.config/uv/uv.toml
    mode: "0644"
  - target: ~/.local/bin/diff-deep
    source: shared/home/.local/bin/diff-deep
    mode: "0755"
  # nix-config home/git/default.nix activation.ghAuth (laptops get gh auth
  # from sops). Failed runs retry next deploy.
  - target: ~/.local/bin/gh-auth-login
    source: machines/Ivans-Mac-mini/.local/bin/gh-auth-login
    mode: "0755"
    onChange: ~/.local/bin/gh-auth-login
  - target: "~/Library/Application Support/Firefox/Profiles/default/user.js"
    source: "machines/Ivans-Mac-mini/Library/Application Support/Firefox/Profiles/default/user.js"
    mode: "0644"
  - target: "~/Library/Application Support/Firefox/profiles.ini"
    source: "shared/home/Library/Application Support/Firefox/profiles.ini"
    mode: "0644"
    backup: false
  - target: ~/.pi/agent/settings.json
    source: machines/Ivans-Mac-mini/.pi/agent/settings.json
    mode: "0644"
    backup: false
  - target: ~/.pi/agent/models.json
    source: machines/Ivans-Mac-mini/.pi/agent/models.json
    mode: "0644"
  - target: ${externalStoragePath}/.opentofu/plugin-cache
    directory: true
  - target: ~/.ssh/authorized_keys
    source: machines/Ivans-Mac-mini/.ssh/authorized_keys
    mode: "0600"
  - target: ${externalStoragePath}/.local/share/caddy/build.env
    source: machines/Ivans-Mac-mini/.local/share/caddy/build.env
    mode: "0644"
    onChange: >-
      . ${externalStoragePath}/.local/share/caddy/build.env &&
      ${goBin}/xcaddy build "$CADDY_VERSION"
      --with "github.com/caddy-dns/cloudflare@$CADDY_DNS_CLOUDFLARE_VERSION"
      --output ${externalStoragePath}/.local/bin/caddy
    restartUnits: [launchd:com.ivankovnatsky.caddy]
  - source: templates/Caddyfile
    target: /etc/caddy/Caddyfile.template
    mode: "0644"
  - source: machines/Ivans-Mac-mini/etc/resolver/ts.net
    target: /etc/resolver/ts.net
    mode: "0644"
  - source: ${toolsPath}/packages/eat/eat.sh
    target: /Volumes/Storage/Data/.local/bin/eat
    mode: "0755"
  - source: ${toolsPath}/packages/find-grep/find-grep.sh
    target: /Volumes/Storage/Data/.local/bin/find-grep
    mode: "0755"
  - source: ${toolsPath}/packages/ghq-cd/ghq-cd.sh
    target: /Volumes/Storage/Data/.local/bin/ghq-cd
    mode: "0755"
  - source: ${toolsPath}/packages/go-lint-wrapper/go-lint-wrapper.sh
    target: /Volumes/Storage/Data/.local/bin/go-lint-wrapper
    mode: "0755"
  - source: ${toolsPath}/packages/gpg-edit/gpg-edit.sh
    target: /Volumes/Storage/Data/.local/bin/gpg-edit
    mode: "0755"
  - source: ${toolsPath}/packages/gwq-merge/gwq-merge.sh
    target: /Volumes/Storage/Data/.local/bin/gwq-merge
    mode: "0755"
  - source: ${toolsPath}/packages/image-meta/image-meta.sh
    target: /Volumes/Storage/Data/.local/bin/image-meta
    mode: "0755"
  - source: ${toolsPath}/packages/nvim-edit-staged/nvim-edit-staged.sh
    target: /Volumes/Storage/Data/.local/bin/nvim-edit-staged
    mode: "0755"
  - source: ${toolsPath}/packages/nvim-find-edit/nvim-find-edit.sh
    target: /Volumes/Storage/Data/.local/bin/nvim-find-edit
    mode: "0755"
  - source: ${toolsPath}/packages/path-copy/path-copy.sh
    target: /Volumes/Storage/Data/.local/bin/path-copy
    mode: "0755"
  - source: ${toolsPath}/packages/reboot/reboot.sh
    target: /Volumes/Storage/Data/.local/bin/reboot
    mode: "0755"
  - source: ${toolsPath}/packages/tac/tac.sh
    target: /Volumes/Storage/Data/.local/bin/tac
    mode: "0755"
  - source: ${toolsPath}/packages/tmux-attach/tmux-attach.sh
    target: /Volumes/Storage/Data/.local/bin/tmux-attach
    mode: "0755"
  - source: ${toolsPath}/packages/torrent-dl/torrent-dl.fish
    target: /Volumes/Storage/Data/.local/bin/torrent-dl
    mode: "0755"

links:
  - source: ${externalStoragePath}/.cache/qmd
    target: ~/.cache/qmd

brew:
  brews:
    - autossh
    - name: dnsmasq
      restartUnits: [launchd:com.ivankovnatsky.dnsmasq]
    - name: forgejo
      restartUnits: [launchd:com.ivankovnatsky.forgejo]
    # backup-home --tar gnutar runs gtar.
    - gnu-tar
    - name: mailpit
      restartUnits: [launchd:com.ivankovnatsky.mailpit]
    - make
    - name: miniserve
      restartUnits: [launchd:com.ivankovnatsky.miniserve]
    - name: navidrome
      restartUnits: [launchd:com.ivankovnatsky.navidrome]
    # ranger scope.sh previews: odt2txt, 7zz (sevenzip), gstat (coreutils).
    - odt2txt
    - name: rabbitmq
      restartUnits: [launchd:com.ivankovnatsky.rabbitmq]
    - sevenzip
    - name: stubby
      restartUnits: [launchd:com.ivankovnatsky.stubby]
    - name: syncthing
      restartUnits: [launchd:com.ivankovnatsky.syncthing]
    - name: tailscale
      restartUnits: [launchd:com.tailscale.tailscaled]
    - name: transmission-cli
      restartUnits: [launchd:com.ivankovnatsky.transmission]
    - unison
  casks:
    - name: jellyfin
      restartUnits: [launchd:com.ivankovnatsky.jellyfin]
    - losslessswitcher
    - mullvad-vpn
    - silicon-labs-vcp-driver

defaults:
  user:
    com.apple.CloudSubscriptionFeatures.optIn:
      auto_opt_in: false
      device: false
    com.vincent-neo.LosslessSwitcher:
      PreferSampleRateMultiples: false
      com.vincent-neo.LosslessSwitcher-Key-BitDepthDetection: true
      com.vincent-neo.LosslessSwitcher-Key-UserPreferIconStatusBarItem: false
    org.mozilla.firefox:
      EnterprisePoliciesEnabled: true
    com.apple.campo:
      NSStatusItem VisibleCC Item-0: false

dock:
  apps:
    - /System/Applications/Apps.app
    - /Applications/Safari.app
    - /System/Applications/Messages.app
    - /System/Applications/Mail.app
    - /System/Applications/Photos.app
    - /System/Applications/Calendar.app
    - /System/Applications/Contacts.app
    - /System/Applications/Notes.app
    - /System/Applications/Music.app
    - /System/Applications/Podcasts.app
    - /System/Applications/App Store.app
    - /System/Applications/iPhone Mirroring.app
    - /System/Applications/System Settings.app
    - spacer
    - /System/Applications/Utilities/Terminal.app
    - /System/Applications/Utilities/Activity Monitor.app
    - /System/Applications/Passwords.app
    - spacer
    - /Applications/kitty.app
    - /Applications/Firefox Developer Edition.app
    - /Applications/Bitwarden.app
    - /Applications/Obsidian.app
    - /Applications/TaskForge.app
    - /Applications/WhatsApp.app

settingsctl:
  fullDiskAccess:
    - bash
    - smbd
  # Only reports when Location Services is off, as nix-config's activation.
  locationInit: true
  sleep:
    computer: never
    display: 10
    disk: never
  remoteLogin: true

users:
  ivan:
    uid: 502
    shell: /opt/homebrew/bin/fish
