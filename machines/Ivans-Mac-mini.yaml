vars:
  externalVolume: /Volumes/Storage
  externalStoragePath: ${externalVolume}/Data
  hostName: Ivans-Mac-mini
  miniIp: 192.168.50.4
  miniWifiIp: 192.168.50.12
  a3Ip: 192.168.50.6
  a3WifiIp: 192.168.50.11
  bindAddress: 0.0.0.0
  localAddress: 127.0.0.1
  uvBin: ${externalStoragePath}/.local/bin
  npmBin: ${externalStoragePath}/.npm/bin
  goBin: ${externalStoragePath}/.go/bin
  toolsConfigPath: ${home}/Sources/github.com/ivankovnatsky/tools-config
  secretsDir: ${home}/.local/state/tools/secrets
  renderedDir: ${secretsDir}/rendered
  forgejoDir: ${externalStoragePath}/.forgejo
  stashDataDir: ${externalStoragePath}/.stash
  stashDir: ${externalStoragePath}/Stash
  mediaDir: ${externalStoragePath}/Media
  rabbitmqDir: ${externalStoragePath}/.rabbitmq
  podserviceDir: ${externalStoragePath}/.podservice
  transmissionDir: ${externalStoragePath}/.transmission
  agentSessionsDir: ${externalStoragePath}/.local/share/agent-sessions

paths:
  uv: /opt/homebrew/bin
  uvBin: ${externalStoragePath}/.local/bin
  uvToolDir: ${externalStoragePath}/.local/share/uv/tools
  nodejs: /opt/homebrew/bin
  npmBin: ${externalStoragePath}/.npm/bin
  bunBin: ${externalStoragePath}/.bun/bin
  bun: ${externalStoragePath}/.bun/bin
  goPath: ${externalStoragePath}/.go
  goBin: ${externalStoragePath}/.go/bin
  cargoHome: ${externalStoragePath}/.cargo

# Shell env files are the env-* templates; this section only exports into
# tools' own process (uv installs) and the launchd user domain.
env:
  vars:
    UV_PYTHON_INSTALL_DIR: ${externalStoragePath}/.local/share/uv/python
  shells: []
  launchd: true

npm:
  packages:
    "@earendil-works/pi-coding-agent": {}
    "@bitwarden/cli": {}
    "@steipete/summarize": {}
    "@xai-official/grok": {}
    "@tobilu/qmd": {}
    openclaw:
      binary: openclaw
      version: latest
      postInstall: "node scripts/postinstall-bundled-plugins.mjs"

uv:
  packages:
    osxphotos:
      binary: osxphotos
    ruff:
      binary: ruff
    yt-dlp:
      source: yt-dlp[default,curl-cffi]
