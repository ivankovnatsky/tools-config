fetch:
  /Volumes/Storage/Data/.local/bin/stash:
    url: https://github.com/stashapp/stash/releases/download/v0.29.1/stash-macos
    sha256: b8c54d619021b97ee8c6f230f31d430009f45518e9d868505b413351011a7f35
    mode: "0755"

files:
  - dir: dotfiles
  # Overrides dotfiles/.config/uv/uv.toml; launchd jobs and GUI apps read
  # this, not the shell-only UV_* vars.
  - target: ~/.config/uv/uv.toml
    source: machines/Ivans-Mac-mini/.config/uv/uv.toml
    mode: "0644"
  - target: ~/.local/bin/claude-statusline
    source: machines/Ivans-Mac-mini/.local/bin/claude-statusline
    mode: "0755"
  - target: "~/Library/Application Support/Muxy 2/settings.toml"
    source:
      "machines/Ivans-Mac-mini/Library/Application Support/Muxy 2/settings.toml"
    mode: "0644"
    # Muxy rewrites it; set false for one deploy to push repo changes.
    skip: true
  - target: "~/Library/Application Support/Muxy 2/terminal.toml"
    source:
      "machines/Ivans-Mac-mini/Library/Application Support/Muxy 2/terminal.toml"
    mode: "0644"
  - target: "~/Library/Application Support/Firefox/Profiles/default/user.js"
    source:
      "machines/Ivans-Mac-mini/Library/Application
      Support/Firefox/Profiles/default/user.js"
    mode: "0644"
  - target: ~/.pi/agent/settings.json
    source: machines/Ivans-Mac-mini/.pi/agent/settings.json
    mode: "0644"
  - target: ~/.pi/agent/models.json
    source: machines/Ivans-Mac-mini/.pi/agent/models.json
    mode: "0644"
  - target: ~/.grok/config.toml
    source: machines/Ivans-Mac-mini/.grok/config.toml
    mode: "0644"
  - target: ~/.config/amethyst/amethyst.yml
    source: machines/Ivans-Mac-mini/.config/amethyst/amethyst.yml
    mode: "0644"
    onChange: pkill -x Amethyst; open -g -b com.amethyst.Amethyst
  - target: ~/.gnupg
    directory: true
    mode: "0700"
  - target: ~/.gnupg/gpg-agent.conf
    source: machines/Ivans-Mac-mini/.gnupg/gpg-agent.conf
    mode: "0600"
    onChange: if command -v gpgconf >/dev/null; then gpgconf --reload gpg-agent; fi
  - target: ${externalStoragePath}/.opentofu/plugin-cache
    directory: true
  - target: ~/.ssh/config
    source: dotfiles/.ssh/config
    mode: "0600"
  - target: ~/.config/kitty/quick-access-terminal.conf
    source: machines/Ivans-Mac-mini/.config/kitty/quick-access-terminal.conf
    mode: "0644"
  - target: ~/.config/kitty/dark-theme.auto.conf
    source: machines/Ivans-Mac-mini/.config/kitty/dark-theme.auto.conf
    mode: "0644"
  - target: ~/.config/kitty/light-theme.auto.conf
    source: machines/Ivans-Mac-mini/.config/kitty/light-theme.auto.conf
    mode: "0644"
  - target: ~/.config/kitty/no-preference-theme.auto.conf
    source: machines/Ivans-Mac-mini/.config/kitty/no-preference-theme.auto.conf
    mode: "0644"
  - target: ~/.config/kitty/themes/default.conf
    source: machines/Ivans-Mac-mini/.config/kitty/themes/default.conf
    mode: "0644"
  - target: ~/.config/kitty/themes/GitHub_Light.conf
    source: machines/Ivans-Mac-mini/.config/kitty/themes/GitHub_Light.conf
    mode: "0644"
  - target: ~/.config/kitty/themes/Tokyo_Night_Moon.conf
    source: machines/Ivans-Mac-mini/.config/kitty/themes/Tokyo_Night_Moon.conf
    mode: "0644"
  - target: ~/.config/bat/config
    source: dotfiles/.config/bat/config
    onChange: if command -v bat >/dev/null; then bat cache --build; fi
  - target: ~/.config/nvim/lua/config/pack.lua
    source: dotfiles/.config/nvim/lua/config/pack.lua
    onChange: nvim --headless +qa
    onUpdate: nvim --headless "+lua vim.pack.update(nil, { force = true })" +qa
  - source: templates/Caddyfile
    target: /etc/caddy/Caddyfile.template
    mode: "0644"
  - source: machines/Ivans-Mac-mini/etc/resolver/ts.net
    target: /etc/resolver/ts.net
    mode: "0644"
  - target: /etc/shells
    source: machines/Ivans-Mac-mini/etc/shells
    mode: "0644"
  - target: /etc/pam.d/sudo_local
    source: machines/Ivans-Mac-mini/etc/pam.d/sudo_local
    mode: "0444"
  - target: /etc/gitconfig
    source: machines/Ivans-Mac-mini/etc/gitconfig
    mode: "0644"

