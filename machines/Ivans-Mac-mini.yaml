include:
  - ../shared/base.yaml
  - ../shared/darwin.yaml

vars:
  externalStoragePath: /Volumes/Storage/Data

paths:
  uv: /opt/homebrew/bin
  uvBin: ${externalStoragePath}/.local/bin
  uvToolDir: ${externalStoragePath}/.local/share/uv/tools
  nodejs: /opt/homebrew/bin
  npmBin: ${externalStoragePath}/.npm/bin
  bunBin: ${externalStoragePath}/.bun/bin
  bun: ${externalStoragePath}/.bun/bin
  goPath: ${externalStoragePath}/.go
  goBin: ${externalStoragePath}/.go/bin

npm:
  packages:
    "@earendil-works/pi-coding-agent": {}
    "@bitwarden/cli": {}
    "@steipete/summarize": {}
    "@xai-official/grok": {}
    "@tobilu/qmd": {}
    openclaw:
      binary: openclaw
      version: latest
      postInstall: "node scripts/postinstall-bundled-plugins.mjs"

uv:
  packages:
    osxphotos:
      binary: osxphotos
    ruff:
      binary: ruff
    yt-dlp:
      source: yt-dlp[default,curl-cffi]
    mlx-whisper: {}
    gallery-dl: {}
    agent-sessions:
      source: git+https://github.com/ivankovnatsky/tools.git#subdirectory=packages/agent-sessions
      binary: agent-sessions
    battery-monitoring:
      source: git+https://github.com/ivankovnatsky/tools.git#subdirectory=packages/battery-monitoring
      binary: battery-monitoring
    homelab:
      source: git+https://github.com/ivankovnatsky/tools.git#subdirectory=packages/homelab
      binary: homelab
    notifications:
      source: git+https://github.com/ivankovnatsky/tools.git#subdirectory=packages/notifications
      binary: notifications
    reposync:
      source: git+https://github.com/ivankovnatsky/tools.git#subdirectory=packages/reposync
      binary: reposync
    settingsctl:
      source: git+https://github.com/ivankovnatsky/tools.git#subdirectory=packages/settingsctl
      binary: settings
    gh-pr:
      source: git+https://github.com/ivankovnatsky/tools.git#subdirectory=packages/gh-pr
      binary: gh-pr
    podservice:
      source: git+https://github.com/ivankovnatsky/podservice.git
      binary: podservice

go:
  packages:
    go-grip:
      source: github.com/chrishrb/go-grip
      binary: go-grip
    ssh-to-age:
      source: github.com/Mic92/ssh-to-age/cmd/ssh-to-age
      binary: ssh-to-age
    gwq:
      source: github.com/d-kuro/gwq/cmd/gwq
      binary: gwq
    gatus:
      source: github.com/TwiN/gatus/v5
      binary: gatus

pi:
  packages:
    npm:pi-antigravity: {}

curlShell:
  "https://claude.ai/install.sh": bash
  "https://antigravity.google/cli/install.sh": bash

files:
  - dir: dotfiles
  - target: ~/.local/bin/claude-statusline
    source: machines/Ivans-Mac-mini/.local/bin/claude-statusline
    mode: "0755"

gitRepos:
  ~/.local/share/tmux-plugins/tmux-continuum: https://github.com/tmux-plugins/tmux-continuum
  ~/.local/share/tmux-plugins/tmux-sensible: https://github.com/tmux-plugins/tmux-sensible
  ~/.local/share/tmux-plugins/tmux-yank: https://github.com/tmux-plugins/tmux-yank
  # yazi loads <name>.yazi dirs from here; piper.yazi is used by yazi.toml.
  ~/.config/yazi/plugins: https://github.com/yazi-rs/plugins

