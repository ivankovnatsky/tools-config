set  -g default-terminal "xterm-256color"
set  -g base-index      0
setw -g pane-base-index 0

set -g status-keys vi
set -g mode-keys   vi

set  -g mouse             off
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  24
set  -s escape-time       10
set  -g history-limit     2000

# Plugins are cloned by tools gitRepos into ~/.local/share/tmux-plugins.
if-shell "test -f ~/.local/share/tmux-plugins/tmux-continuum/continuum.tmux" "run-shell ~/.local/share/tmux-plugins/tmux-continuum/continuum.tmux"
if-shell "test -f ~/.local/share/tmux-plugins/tmux-sensible/sensible.tmux" "run-shell ~/.local/share/tmux-plugins/tmux-sensible/sensible.tmux"
if-shell "test -f ~/.local/share/tmux-plugins/tmux-yank/yank.tmux" "run-shell ~/.local/share/tmux-plugins/tmux-yank/yank.tmux"

# Update environment variables when attaching to existing sessions
set-option -g update-environment "DISPLAY SSH_AUTH_SOCK WAYLAND_DISPLAY XDG_RUNTIME_DIR SWAYSOCK EDITOR VISUAL LANG"

# Reduce ESC key delay (default 500ms is too slow for vi mode)
# https://neovim.io/doc/user/faq.html#faq
set -sg escape-time 10

# Enable extended keys so modified Enter (e.g. Shift+Enter) works
set -g extended-keys on
# Warning: tmux extended-keys-format is xterm. Pi works best with csi-u.
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

set -g status-right ""
set -g status-left-length 40

# https://github.com/3rd/image.nvim?tab=readme-ov-file#tmux
set -gq allow-passthrough on
set -g visual-activity off

set -g status-bg colour0
set -g status-fg colour15
set -g window-status-current-style fg=colour16,bg=colour15

# https://neovim.io/doc/user/term.html#tui-cursor-shape
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# Enable true color support for neovim
# https://stackoverflow.com/questions/60309665/neovim-colorscheme-does-not-look-right-when-using-nvim-inside-tmux
set-option -sa terminal-overrides ',xterm-256color:RGB'

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Window selection keybinds for windows 10-15
bind-key q select-window -t 10
bind-key w select-window -t 11
bind-key e select-window -t 12
bind-key r select-window -t 13
bind-key t select-window -t 14
bind-key y select-window -t 15
