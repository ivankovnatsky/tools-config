creation_rules:
  # Must come before the generic rule below: sops uses the first match, and
  # `secrets/.*\.yaml$` would match this path too.
  - path_regex: machines/\.mooing/secrets/.*\.yaml$
    key_groups:
    - pgp:
      - *mooing
      age:
      - *mooings-macbook-pro
      - *mooings-macbook-pro-user
      - *mooings-macbook-air
      - *mooings-macbook-air-user
  - path_regex: secrets/.*\.yaml$
    key_groups:
    - pgp:
      - *home
      age:
      - *a3
      - *a3-user
      - *mini
      - *mini-user
      - *macbook-air
      - *macbook-air-user
